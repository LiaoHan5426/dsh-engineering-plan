<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>工作台原型 · 三布局预览</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0e0e10; color: #e8e8ee; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: baseline; padding: 10px 14px; background: #17171a; border-bottom: 1px solid #2b2b32; }
  header h1 { margin: 0; font-size: 14px; }
  header p { margin: 0; color: #9a9aa4; font-size: 12px; }
  .frames { display: grid; gap: 18px; padding: 16px 14px 40px; }
  .frame { border: 1px solid #2b2b32; border-radius: 10px; overflow: hidden; background: #131316; }
  .frame > h2 { margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 600; color: #b9b9c6; background: #1b1b20; border-bottom: 1px solid #2b2b32; }
  .frame .vp { position: relative; overflow: hidden; }
  .frame iframe { border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<header>
  <h1>工作台原型 · 三种布局实测</h1>
  <p>每个面板是真实 iframe，按各自视口宽度渲染媒体查询：1440 宽屏 / 1240 并排 / 380 窄侧栏</p>
</header>
<div class="frames">
  <section class="frame">
    <h2>① 宽屏工作台 · viewport 1440×980（缩放 0.62）</h2>
    <div class="vp" style="height:608px"><iframe src="engineering-workbench.html" width="1440" height="980" style="zoom:.62;transform-origin:0 0"></iframe></div>
  </section>
  <section class="frame">
    <h2>② 聊天 + 工作台并排 · viewport 1240×900（缩放 0.74）</h2>
    <div class="vp" style="height:666px"><iframe src="engineering-workbench.html" width="1240" height="900" style="zoom:.74;transform-origin:0 0"></iframe></div>
  </section>
  <section class="frame">
    <h2>③ 窄侧栏 · viewport 380×900（缩放 1）</h2>
    <div class="vp" style="height:900px"><iframe src="engineering-workbench.html" width="380" height="900"></iframe></div>
  </section>
</div>
<script>
  // 同源 iframe：直接把每个面板设成对应布局，便于同屏对比
  const layouts = ["wide", "split", "narrow"];
  const apply = (frame, layout) => {
    try {
      const doc = frame.contentDocument;
      if (!doc) return;
      const app = doc.querySelector(".app");
      if (app) app.dataset.layout = layout;
      doc.body.dataset.layout = layout;
      const btn = [...doc.querySelectorAll("button")].find((b) =>
        layout === "wide" ? b.textContent.trim() === "宽屏" : layout === "split" ? b.textContent.includes("聊天 + 工作台") : b.textContent.includes("窄侧栏"));
      if (btn) btn.setAttribute("aria-pressed", "true");
    } catch (error) { /* 跨源时忽略 */ }
  };
  document.querySelectorAll(".frame iframe").forEach((frame, index) => {
    const run = () => setTimeout(() => {
      try {
        const doc = frame.contentDocument;
        if (doc) 
      } catch (error) { /* ignore */ }
      apply(frame, layouts[index]);
    }, 60);
    if (frame.contentDocument?.readyState === "complete") run();
    frame.addEventListener("load", run);
  });
</script>
</body>
</html>
